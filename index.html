<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geschichtsverein Helsa</title>
<meta name="description" content="Geschichtsverein Helsa – Chronik, Verein und Archiv der Ortsteile Helsa, Wickenrode, Eschenstruth, St. Ottilien und Waldhof.">
<link rel="stylesheet" href="css/stil.css">
</head>
<body>

<div id="laden">Das Regal wird eingeräumt …</div>

<canvas id="szene"></canvas>
<div class="vignette"></div>
<div id="abdunkeln"></div>
<div id="fortschritt"><i></i></div>

<header id="menue">
  <div class="leiste">
    <button class="marke" id="marke" type="button"></button>
    <nav id="buchtabs" aria-label="Bücher"></nav>
    <div class="rechts">
      <button id="regal-knopf" type="button">Zurück ins Regal</button>
      <button id="inhalt-knopf" type="button" aria-expanded="false" aria-controls="inhaltsverzeichnis">Inhalt <i aria-hidden="true"></i></button>
    </div>
  </div>
</header>
<div id="inhaltsverzeichnis" role="dialog" aria-modal="true" aria-labelledby="iv-titel">
  <button class="schliessen" type="button" id="iv-schliessen">Schließen</button>
  <h2 id="iv-titel">Inhalt</h2>
  <ol id="iv-liste"></ol>
</div>

<section class="ebene" id="intro">
  <h1 id="intro-titel"></h1>
  <p class="intro-text" id="intro-text"></p>
  <div id="buchliste"></div>
</section>
<div id="hinweis"><span id="hinweis-text"></span><i></i></div>

<aside class="ebene kapitel" id="inhaltsseite"><div class="kapitel-inhalt"><div class="kapitel-text">
  <p class="buchtitel" id="is-buch"></p>
  <h2>Inhalt</h2>
  <ol id="is-liste"></ol>
</div><i class="mehr" aria-hidden="true"></i></div></aside>

<div id="kapitel-container"></div>

<section class="ebene" id="schluss">
  <h2 id="schluss-titel"></h2>
  <div id="schluss-buecher"></div>
  <address id="schluss-kontakt"></address>
  <a class="aktion" id="schluss-aktion" href="#"></a>
  <div class="rechtliches" id="schluss-rechtliches"></div>
</section>

<div id="lichtbox" role="dialog" aria-modal="true" aria-label="Bildergalerie">
  <div class="kopf">
    <span class="ueberschrift" id="lb-titel"></span>
    <span class="zaehler" id="lb-zaehler"></span>
    <button class="zu" id="lb-zu" type="button" aria-label="Galerie schließen">×</button>
  </div>
  <div class="buehne">
    <button class="pfeil zurueck" id="lb-zurueck" type="button" aria-label="Vorheriges Bild">‹</button>
    <img id="lb-bild" alt="">
    <button class="pfeil weiter" id="lb-weiter" type="button" aria-label="Nächstes Bild">›</button>
  </div>
  <div class="bu" id="lb-bu"></div>
  <div class="streifen" id="lb-streifen"></div>
</div>

<div id="scroll" aria-hidden="true"></div>

<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/gsap.min.js"></script>
<script src="js/vendor/ScrollTrigger.min.js"></script>
<script src="js/inhalt.js"></script>
<script src="js/texturen.js"></script>
<script src="js/buch.js"></script>
<script src="js/szene.js"></script>
<script src="js/oberflaeche.js"></script>
<script src="js/chronik.js"></script>
</body>
</html>
